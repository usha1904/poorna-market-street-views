<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poorna Market Street VR Viewer</title>
    
    <!-- Include the A-Frame library (crucial for WebXR/VR) -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- Basic styling for the loading screen and interface -->
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        
        /* Loading screen styles */
        #loading-screen {
            position: absolute; width: 100%; height: 100%;
            background-color: #1a1a1a; color: white;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; font-family: sans-serif;
            transition: opacity 0.5s;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* UI overlay in non-VR mode */
        #ui-overlay {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.7); color: white;
            padding: 10px 20px; border-radius: 8px;
            font-family: sans-serif; pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Loading Screen (hidden via JS when scene loads) -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div>Loading Poorna Market...</div>
    </div>

    <!-- UI Overlay for desktop/mobile view -->
    <div id="ui-overlay">
        <h3>Poorna Market Street</h3>
        <p>Drag to look around. Click "Enter VR" on your Meta Quest.</p>
    </div>

    <!-- The A-Frame Scene -->
    <a-scene loading-screen="enabled: false">
        
        <!-- Asset Management System: Preloads the image -->
        <a-assets>
            <!-- 
               CRITICAL: Change "market_panorama.jpg" below to match 
               the actual filename of your saved 360 image.
            -->
            <img id="market-texture" src="market_panorama.jpg" alt="Poorna Market Panorama">
        </a-assets>

        <!-- The Skybox: This displays the 360 image -->
        <!-- 'phi-start: 180' rotates the image to a good starting view -->
        <a-sky src="#market-texture" rotation="0 180 0"></a-sky>

        <!-- Camera setup (defines user starting position) -->
        <a-entity camera look-controls position="0 1.6 0"></a-entity>

    </a-scene>

    <!-- JavaScript to handle the loading screen -->
    <script>
        // Wait until the A-Frame scene has loaded all assets
        document.querySelector('a-scene').addEventListener('loaded', function () {
            // Hide the loading screen
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 500);
        });
    </script>

</body>
</html>
