<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Poorna Market Street | Realistic VR Architectural Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --gold: #dfb76c;
      --bg-glass: rgba(14, 18, 24, 0.78);
      --border-glass: rgba(223, 183, 108, 0.28);
      --text-main: #f5f6f8;
      --text-muted: #9da6b3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; color: var(--text-main); }
    #webgl-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    /* Top Royal Header */
    .top-header {
      position: absolute; top: 0; left: 0; right: 0; height: 68px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; z-index: 20;
      background: linear-gradient(180deg, rgba(7,9,13,0.85) 0%, rgba(7,9,13,0) 100%);
      pointer-events: none;
    }
    .top-header > * { pointer-events: auto; }
    .brand-title { font-family: 'Cinzel', serif; font-size: 15px; letter-spacing: 2px; color: var(--gold); }
    .brand-sub { font-size: 11px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }

    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-pill {
      background: var(--bg-glass); border: 1px solid var(--border-glass);
      color: var(--text-main); padding: 8px 16px; border-radius: 40px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      backdrop-filter: blur(20px); transition: all 0.2s;
    }
    .btn-pill:hover { border-color: var(--gold); color: var(--gold); }
    .btn-vr {
      background: linear-gradient(135deg, #d4af37, #aa820a);
      border: 1px solid #ffe599; color: #000; font-weight: 700;
    }

    /* Krpano / Belgian Palace Bottom Dock */
    .dock-container {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px; z-index: 20;
      background: var(--bg-glass); border: 1px solid var(--border-glass);
      padding: 6px 14px; border-radius: 40px; backdrop-filter: blur(24px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }
    .dock-btn {
      background: transparent; border: none; color: var(--text-main);
      width: 38px; height: 38px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 15px;
      cursor: pointer; transition: all 0.2s;
    }
    .dock-btn:hover { background: rgba(223, 183, 108, 0.18); color: var(--gold); }
    .dock-readout {
      font-size: 11px; font-family: monospace; color: var(--gold);
      padding: 0 8px; border-left: 1px solid rgba(255,255,255,0.12);
      border-right: 1px solid rgba(255,255,255,0.12);
    }

    /* Spatial Hotspots */
    .hotspot {
      position: absolute; transform: translate(-50%, -50%);
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid var(--gold); background: rgba(14, 18, 24, 0.65);
      cursor: pointer; z-index: 10; display: flex; align-items: center;
      justify-content: center; transition: transform 0.2s;
    }
    .hotspot::after {
      content: ''; position: absolute; inset: -6px; border-radius: 50%;
      border: 1px solid var(--gold); opacity: 0.5; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.8; } 100% { transform: scale(1.6); opacity: 0; } }
    .hotspot-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }

    /* Hidden File Input */
    #file-input { display: none; }
  </style>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <div class="top-header">
    <div>
      <div class="brand-title">POORNA MARKET STREET</div>
      <div class="brand-sub">Architectural Spatial Experience</div>
    </div>
    <div class="header-actions">
      <button class="btn-pill" onclick="document.getElementById('file-input').click()">Upload 360 Pano</button>
      <input type="file" id="file-input" accept="image/*">
      <button class="btn-pill btn-vr" id="enter-vr-btn">ENTER VR</button>
    </div>
  </div>

  <div class="dock-container">
    <button class="dock-btn" onclick="adjustZoom(-5)">−</button>
    <div class="dock-readout" id="zoom-readout">60° FOV</div>
    <button class="dock-btn" onclick="adjustZoom(5)">+</button>
    <button class="dock-btn" id="toggle-autorotate" title="Auto Rotate">↻</button>
    <button class="dock-btn" id="recenter-btn" title="Recenter View">⌖</button>
  </div>

  <div id="hotspot-fountain" class="hotspot" title="Central Cascade Spine">
    <div class="hotspot-dot"></div>
  </div>

  <script>
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0.1);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.xr.enabled = true;

    // High-resolution sphere geometry
    const geometry = new THREE.SphereGeometry(500, 96, 64);
    geometry.scale(-1, 1, 1);

    const textureLoader = new THREE.TextureLoader();
    const material = new THREE.MeshBasicMaterial({ color: 0x222222 });
    const sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);

    function applyTexture(texture) {
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = false;
      material.map = texture;
      material.color.set(0xffffff);
      material.needsUpdate = true;
    }

    // Direct auto-load for Poorna Market Enscape renders
    const candidateRenders = ['./poorna-market-view.jpg', './market_panorama.jpg', './istockphoto-2257113869-1024x1024.jpg'];
    function tryLoadImages(index) {
      if (index >= candidateRenders.length) return;
      textureLoader.load(
        candidateRenders[index],
        (tex) => applyTexture(tex),
        undefined,
        () => tryLoadImages(index + 1)
      );
    }
    tryLoadImages(0);

    // Local custom file upload
    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const texture = new THREE.Texture(img);
          texture.needsUpdate = true;
          applyTexture(texture);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Navigation Controls
    let isUserInteracting = false;
    let onPointerDownMouseX = 0, onPointerDownMouseY = 0;
    let lon = 180, onPointerDownLon = 0;
    let lat = 0, onPointerDownLat = 0;
    let phi = 0, theta = 0;
    let autoRotate = true;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.dock-container') || e.target.closest('.top-header') || e.target.closest('.hotspot')) return;
      isUserInteracting = true;
      onPointerDownMouseX = e.clientX;
      onPointerDownMouseY = e.clientY;
      onPointerDownLon = lon;
      onPointerDownLat = lat;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isUserInteracting) return;
      lon = (onPointerDownMouseX - e.clientX) * 0.15 + onPointerDownLon;
      lat = (e.clientY - onPointerDownMouseY) * 0.15 + onPointerDownLat;
    });

    window.addEventListener('pointerup', () => { isUserInteracting = false; });

    function adjustZoom(delta) {
      camera.fov = THREE.MathUtils.clamp(camera.fov + delta, 35, 95);
      camera.updateProjectionMatrix();
      document.getElementById('zoom-readout').textContent = `${Math.round(camera.fov)}° FOV`;
    }

    document.getElementById('toggle-autorotate').addEventListener('click', () => {
      autoRotate = !autoRotate;
    });

    document.getElementById('recenter-btn').addEventListener('click', () => {
      lon = 180; lat = 0; camera.fov = 60; camera.updateProjectionMatrix();
      document.getElementById('zoom-readout').textContent = '60° FOV';
    });

    // WebXR Meta Quest Trigger
    const enterVrBtn = document.getElementById('enter-vr-btn');
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
        if (!supported) enterVrBtn.style.display = 'none';
      });
      enterVrBtn.addEventListener('click', () => {
        navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] }).then((session) => {
          renderer.xr.setSession(session);
        });
      });
    } else {
      enterVrBtn.style.display = 'none';
    }

    // Render Loop
    renderer.setAnimationLoop(() => {
      if (autoRotate && !isUserInteracting && !renderer.xr.isPresenting) {
        lon += 0.04;
      }
      lat = Math.max(-85, Math.min(85, lat));
      phi = THREE.MathUtils.degToRad(90 - lat);
      theta = THREE.MathUtils.degToRad(lon);

      if (!renderer.xr.isPresenting) {
        camera.target = new THREE.Vector3(
          500 * Math.sin(phi) * Math.cos(theta),
          500 * Math.cos(phi),
          500 * Math.sin(phi) * Math.sin(theta)
        );
        camera.lookAt(camera.target);
      }

      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
