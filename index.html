<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sardar Vallabhbhai Patel Market | 360 VR Experience</title>

  <!-- Typography: Royal Serif + Multilingual Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Three.js for Equirectangular WebGL and WebXR rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --gold-line: rgba(223, 183, 108, 0.75);
      --gold-accent: #dfb76c;
      --gold-glow: rgba(223, 183, 108, 0.45);
      --terracotta-red: #8B3A3A;
      --terracotta-burgundy: #581C14;
      --terracotta-rust: #A8473B;
      --text-ivory: #fcf9f2;
      --text-muted: #e4d7c5;
      --bg-glass: rgba(14, 18, 24, 0.88);
      --bg-glass-card: rgba(45, 14, 10, 0.92);
      --border-accent: rgba(229, 152, 138, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #080a0e; font-family: 'Inter', sans-serif; color: var(--text-ivory); }
    #webgl-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    /* ==========================================================================
       HERITAGE INTERACTIVE WELCOME SCREEN
       ========================================================================== */
    #welcome-screen {
      position: absolute; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: clamp(14px, 3vw, 36px);
      background: radial-gradient(circle at center, rgba(14, 18, 24, 0.35) 0%, rgba(6, 8, 12, 0.82) 100%);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
      pointer-events: auto;
    }
    #welcome-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .outer-border-frame {
      position: absolute;
      top: clamp(12px, 2.4vw, 28px);
      bottom: clamp(12px, 2.4vw, 28px);
      left: clamp(12px, 2.4vw, 28px);
      right: clamp(12px, 2.4vw, 28px);
      border: 1px solid var(--gold-line);
      pointer-events: none;
      box-shadow: inset 0 0 24px rgba(0,0,0,0.6), 0 0 16px rgba(223, 183, 108, 0.15);
    }

    .welcome-top {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      margin-top: 6px;
    }

    .market-sketch {
      width: clamp(88px, 8.5vw, 125px); height: auto; margin-bottom: 6px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.9));
    }
    .market-sketch path, .market-sketch rect, .market-sketch line, .market-sketch circle, .market-sketch polygon {
      stroke: var(--gold-line); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round;
    }

    .monarchy-brand-label {
      font-family: 'Cinzel', serif; font-size: clamp(10px, 1.1vw, 13px);
      letter-spacing: clamp(3px, 0.4vw, 5px); color: var(--gold-line); text-transform: uppercase;
      font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    .welcome-center {
      position: relative; z-index: 2;
      max-width: 900px; width: 100%; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px;
    }

    .tour-title {
      font-family: 'Cinzel', serif; font-size: clamp(20px, 3vw, 36px);
      font-weight: 700; letter-spacing: 2px; color: #ffffff;
      text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 0 25px rgba(0,0,0,0.85);
      margin-bottom: 4px; line-height: 1.25;
    }

    .tour-subtitle {
      font-family: 'Cinzel', serif; font-size: clamp(11px, 1.4vw, 15px);
      font-weight: 600; letter-spacing: 4px; color: var(--gold-line);
      text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      margin-bottom: 14px;
    }

    /* Interactive Heritage Story Badges */
    .heritage-tags {
      display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center;
    }
    .heritage-badge {
      background: rgba(88, 28, 20, 0.45); border: 1px solid var(--border-accent);
      padding: 4px 12px; border-radius: 20px; font-size: 10px; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--gold-accent); cursor: pointer;
      backdrop-filter: blur(10px); transition: all 0.25s;
    }
    .heritage-badge:hover, .heritage-badge.active {
      background: var(--terracotta-rust); color: #fff; border-color: var(--gold-line);
      box-shadow: 0 0 14px rgba(223, 183, 108, 0.4);
    }

    .tour-description {
      font-size: clamp(11.5px, 1.05vw, 14px); line-height: 1.74;
      color: var(--text-ivory); font-weight: 300; max-width: 820px;
      margin-bottom: 26px; text-shadow: 0 2px 10px rgba(0,0,0,0.95);
      text-wrap: balance; transition: all 0.3s ease;
    }

    .lang-te .tour-title, .lang-te .tour-subtitle, .lang-te .tour-description, .lang-te .diamond-label {
      font-family: 'Noto Sans Telugu', sans-serif !important; letter-spacing: 0.5px !important;
    }
    .lang-hi .tour-title, .lang-hi .tour-subtitle, .lang-hi .tour-description, .lang-hi .diamond-label {
      font-family: 'Noto Sans Devanagari', sans-serif !important; letter-spacing: 0.5px !important;
    }

    .diamond-btn-container {
      position: relative; width: 105px; height: 105px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; background: transparent; border: none; outline: none;
    }
    .diamond-bg {
      position: absolute; inset: 12px;
      background: rgba(14, 18, 24, 0.75);
      border: 1.5px solid var(--gold-line);
      transform: rotate(45deg);
      backdrop-filter: blur(10px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    }
    .diamond-btn-container:hover .diamond-bg {
      transform: rotate(45deg) scale(1.12);
      border-color: #ffffff;
      background: rgba(223, 183, 108, 0.35);
      box-shadow: 0 0 28px rgba(223, 183, 108, 0.75);
    }
    .diamond-pulse-ring {
      position: absolute; inset: 4px;
      border: 1px solid var(--gold-line);
      transform: rotate(45deg);
      animation: diamondPulse 2.4s infinite cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
    }
    @keyframes diamondPulse {
      0% { transform: rotate(45deg) scale(0.9); opacity: 0.9; }
      100% { transform: rotate(45deg) scale(1.45); opacity: 0; }
    }
    .diamond-label {
      position: relative; z-index: 2;
      font-family: 'Cinzel', serif; font-size: 10.5px; font-weight: 700;
      letter-spacing: 1.8px; color: #ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      text-align: center; line-height: 1.25; text-transform: uppercase;
      pointer-events: none; padding: 0 6px;
    }

    .welcome-bottom {
      position: relative; z-index: 2; margin-bottom: 4px;
    }
    .language-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; font-size: clamp(10.5px, 1.05vw, 12.5px); letter-spacing: 2.5px;
      color: var(--text-muted); text-transform: uppercase;
    }
    .lang-btn {
      cursor: pointer; transition: all 0.25s; padding: 4px 6px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }
    .lang-btn:hover { color: #ffffff; text-shadow: 0 0 8px var(--gold-line); }
    .lang-btn.active {
      color: var(--gold-line); font-weight: 700; border-bottom: 1.5px solid var(--gold-line);
    }
    .lang-sep { color: var(--gold-line); opacity: 0.6; font-size: 9px; }

    /* ==========================================================================
       TOP ARCHITECTURAL HUD
       ========================================================================== */
    .top-hud {
      position: absolute; top: 0; left: 0; right: 0; height: 68px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; z-index: 20;
      background: linear-gradient(180deg, rgba(7,9,13,0.9) 0%, rgba(7,9,13,0) 100%);
      pointer-events: none; opacity: 0; visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s;
    }
    .top-hud.visible { opacity: 1; visibility: visible; }
    .top-hud > * { pointer-events: auto; }
    .hud-brand { font-family: 'Cinzel', serif; font-size: 14.5px; letter-spacing: 2px; color: var(--gold-line); font-weight: 700; }
    .hud-sub { font-size: 10px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }

    .hud-actions { display: flex; gap: 10px; align-items: center; }
    .btn-action {
      background: rgba(14, 18, 24, 0.75); border: 1px solid var(--gold-line);
      color: var(--text-ivory); padding: 7px 16px; border-radius: 30px;
      font-size: 11px; font-weight: 600; cursor: pointer; letter-spacing: 1px;
      backdrop-filter: blur(14px); transition: all 0.2s;
    }
    .btn-action:hover { border-color: #ffffff; color: var(--gold-line); }
    .btn-vr-trigger {
      background: linear-gradient(135deg, #dfb76c, #996e00);
      border: 1px solid #ffe89e; color: #000; font-weight: 700;
    }

    /* ==========================================================================
       CORNER MINI-MAP (BOTTOM-LEFT)
       ========================================================================== */
    .map-widget-
